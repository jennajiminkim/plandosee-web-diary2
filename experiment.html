<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5일 관찰 기록 — plan.do.see</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth-gate"><section class="auth-panel" style="width:min(100%,720px)"><div class="auth-brand">plan.do.see <small>FIVE DAY RECORD · TASK 07</small></div><h1>나의 5일 관찰 기록</h1><p>동일한 지표를 서울 날짜 기준으로 하루 한 번 기록합니다. 2일차 종료 후 처리 규칙 한 가지를 바꾸고, 3~5일차에는 같은 계산 기준을 유지합니다.</p><p id="status" role="status">로그인 확인 중...</p><form id="setup" hidden><div class="panel" style="background:#f0f5ff;border:1px solid #dce7f8;border-radius:12px;padding:15px;margin:16px 0"><strong>MY FIRST STEP · 5일 관찰</strong><p style="margin:7px 0 12px;font-size:13px">우리가 정한 2분 첫 행동 관찰 규칙을 아래 입력칸에 자동으로 채웁니다. 검토 후 직접 저장해 주세요.</p><button id="firstStepPreset" type="button" class="light">MY FIRST STEP 관찰 규칙 채우기</button></div><label>관찰할 질문<input name="question" maxlength="500" placeholder="예: 작은 실천이 매일 얼마나 쌓이나요?" required></label><label>측정 지표<input name="metric_name" maxlength="120" placeholder="예: 오늘의 집중 공부 시간" required></label><label>단위<input name="metric_unit" maxlength="40" placeholder="예: 분" required></label><label>계산 방법<textarea name="calculation_rule" required maxlength="1000" placeholder="하루 동안 실제로 집중한 시간 합계"></textarea></label><label>누락값 처리<input name="missing_rule" maxlength="500" required value="측정하지 못한 날은 값을 추정하지 않고 사유를 적습니다."></label><label>중복값 처리<input name="duplicate_rule" maxlength="500" required value="하루 여러 번 측정한 값은 같은 시간을 중복 합산하지 않습니다."></label><label>이상값 처리<input name="outlier_rule" maxlength="500" required value="이상값은 원인 확인 후 원자료와 함께 기록합니다."></label><label>반올림 처리<input name="rounding_rule" maxlength="500" required value="소수점 넷째 자리까지 기록합니다."></label><button type="submit" class="auth-submit">관찰 규칙 저장</button></form><section id="dashboard" hidden><div id="summary" class="panel"></div><h2 style="margin:22px 0 12px">기록하기</h2><form id="record"><label>오늘의 측정값<input type="number" name="metric_value" min="0" max="100000000" step="0.0001" required></label><label>실제 활동과 측정 근거<textarea name="note" maxlength="1500" rows="3" required placeholder="오늘 어떤 활동을 몇 분 했는지, 측정 근거를 적어 주세요."></textarea></label><button type="submit" class="auth-submit">오늘 기록 저장</button></form><form id="revision" hidden><h2>2일차 이후 규칙 변경 (1회)</h2><label>변경할 처리 규칙<select name="rule_field"><option value="missing_rule">누락값</option><option value="duplicate_rule">중복값</option><option value="outlier_rule">이상값</option><option value="rounding_rule">반올림</option></select></label><label>새 규칙<textarea name="new_rule" maxlength="500" required></textarea></label><label>변경 이유 (1·2일차 관찰 근거)<textarea name="reason" maxlength="1500" required></textarea></label><button type="submit" class="auth-submit">규칙 1가지 변경 확정</button></form><h2 style="margin:22px 0 10px">기록과 비교</h2><div id="history" class="panel"></div></section><p><a href="/" style="color:#2855a8">← 플래너 돌아가기</a></p></section></main><script src="/experiment-ui.js" defer></script></body></html>
