<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>계정 격리 검사 — plan.do.see</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth-gate"><section class="auth-panel" style="width:min(100%,680px)"><div class="auth-brand">plan.do.see <small>ISOLATION TEST · Task 07</small></div><h1 style="margin-top:24px;font-size:25px">계정별 기록 보호 검사</h1><p class="auth-intro">본인 계정에서만 볼 수 있는 전용 테스트 계획을 생성하고, 다른 계정에서 같은 ID로 조회·수정·삭제를 요청해 차단을 확인합니다.</p><p id="identity" role="status" aria-live="polite">로그인 확인 중...</p><p><button id="createTest" class="auth-submit" disabled>테스트 계획 1개 생성</button> <button id="listTest" class="auth-toggle" disabled>내 테스트 목록 조회</button></p><label style="display:grid;gap:5px;font-size:13px">확인할 테스트 기록 ID<input id="recordId" aria-label="검사할 기록 ID" placeholder="기록 UUID" autocomplete="off" style="width:100%;padding:12px;border:1px solid #d7dfed;border-radius:8px"></label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button id="readTest" class="auth-toggle" disabled>ID 조회</button><button id="editTest" class="auth-toggle" disabled>ID 수정 시도</button><button id="deleteTest" class="auth-toggle" disabled>ID 삭제 시도</button></div><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f5fd;border-radius:12px;padding:14px;font-size:12px;max-height:360px;overflow:auto">아직 검사를 실행하지 않았습니다.</pre><p class="auth-intro">다른 계정의 ID를 조회·수정·삭제하면 <strong>404 not_found</strong>가 정상 거부입니다. 본인 기록 삭제는 실제로 해당 테스트 계획을 소프트 삭제합니다. 실사용 다이어리 데이터는 이 화면에서 조작할 수 없습니다.</p><a href="/" style="font-size:13px;color:#244da4">← 로그인 화면으로</a></section></main><script src="/isolation-test-ui.js" defer></script></body></html>
