<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>과제 7 — 시험용 계정 세션 폐기 검사</title>
 <link rel="stylesheet" href="/style.css">
</head>
<body>
 <main class="auth-gate">
  <section class="auth-panel" style="width:min(100%,620px)">
   <div class="auth-brand">plan.do.see <small>TEST ACCOUNT ONLY · TASK 07</small></div>
   <h1 style="font-size:24px;margin-top:16px">비밀번호 변경과 다른 세션 무효화 검사</h1>
   <p class="auth-intro">이 페이지는 시험용 계정의 실제 비밀번호를 변경할 수 있습니다. 운영 다이어리 계정에서는 실행하지 마세요. 먼저 별도의 두 브라우저 창에서 같은 시험용 계정으로 로그인해야 합니다.</p>
   <p id="status" role="status" aria-live="polite">로그인 세션 확인 중…</p>
   <!-- A template is inert: password controls do not exist in the live DOM until a verified session. -->
   <div id="passwordFormMount"></div>
   <template id="passwordFormTemplate">
   <form id="testForm" autocomplete="off" style="gap:12px">
    <label>현재 비밀번호 <input name="currentPassword" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label>
    <label>변경할 새 비밀번호 <input name="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <label style="display:flex;gap:10px;align-items:flex-start">
      <input type="checkbox" id="consent" required style="width:auto;margin-top:4px">
      <span>시험용 계정에서만 검사하며, 다른 로그인 세션이 종료될 수 있고 이후 새 비밀번호로 로그인해야 함을 이해했습니다.</span>
    </label>
    <button type="submit" id="submit" class="auth-submit" disabled>비밀번호 변경 및 다른 세션 무효화</button>
   </form>
   </template>
   <p class="auth-intro">코드만 준비된 상태에서는 서버 보호 설정이 꺼져 있어 요청을 받아들이지 않습니다. 담당자가 Preview 환경에 계정별 허용 설정을 추가하고, 사용자가 실제 변경을 승인한 후에만 진행합니다.</p>
   <a href="/" style="font-size:13px;color:#244da4">← 돌아가기</a>
  </section>
 </main>
 <script src="/password-session-test-ui.js" defer></script>
</body>
</html>
